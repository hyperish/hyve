# Measurements of hyve's own cores against the originals they were made
# from (docs/05-implementation-plan.md, 포크 기록). Not published and not a
# member of the hyve workspace: the baselines stay out of hyve's lockfile
# and gates. Run: `cargo run --release` in this directory.
[package]
name = "hyve-bench"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
hyve-parser-baseline = { package = "hyve-parser", version = "=0.1.0-alpha.1" }
hyve-diagnostics-baseline = { package = "hyve-diagnostics", version = "=0.1.0-alpha.1" }
hyve-core-baseline = { package = "hyve-core", version = "=0.1.0-alpha.1" }
hyve-diagnostics = { path = "../../crates/hyve-diagnostics" }
hyve = { path = "../../crates/hyve" }
hyve-core = { path = "../../crates/hyve-core" }
hyve-state = { path = "../../crates/hyve-state" }
hyve-serde = { path = "../../crates/hyve-serde" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.154"
# The fork record's reference version.
reactive_graph = "=0.3.0-rc1"
# No features of its own: the archive format stays the one hyve-serde builds.
rkyv = { version = "=0.8.18", default-features = false }
# The references for hyve-core's own `Ulid` and `SharedRingBuf`.
ulid = "=3.0.0"
rtrb = "=0.4.1"
crossbeam-queue = "=0.3.14"
bytemuck = { version = "=1.25.2", features = ["derive"] }

[workspace]

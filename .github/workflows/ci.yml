name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # Must match `rust-version` in Cargo.toml (hyperish/docs 05-development-rules.md §8).
  MSRV: "1.85"
  WASM_BINDGEN_VERSION: "0.2.130"

jobs:
  check:
    name: Format, Clippy & Test (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run tests
        run: cargo test --workspace --locked
      # The fixture crates play an app's shared crate; `#[server]` handler
      # bodies exist only with their `server` feature, so test both builds.
      - name: Lint and test with the server feature
        run: |
          cargo clippy -p hyve-tests -p hyve-tests-indirect --all-targets --features hyve-tests/server,hyve-tests-indirect/server --locked -- -D warnings
          cargo test -p hyve-tests -p hyve-tests-indirect --features hyve-tests/server,hyve-tests-indirect/server --locked

  msrv:
    name: Build on the declared minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.MSRV }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Check (native)
        run: cargo check --workspace --locked
      - name: Check (wasm32)
        run: cargo check --workspace --locked --target wasm32-unknown-unknown --exclude hyve-cli

  wasm:
    name: Tests on wasm32 (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen test runner
        run: cargo install wasm-bindgen-cli --version ${{ env.WASM_BINDGEN_VERSION }} --locked
      - name: Run wasm32 tests
        # The fixture crates use `#[hyve::test]`, a compile-time error on wasm32 in Phase 1.
        run: cargo test --workspace --locked --target wasm32-unknown-unknown --exclude hyve-cli --exclude hyve-macros --exclude hyve-tests --exclude hyve-tests-indirect
